# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@0.42.0/schema/sync_rules.json
# Sync Streams. Must stay a subset of what RLS allows (ADR-0007); tests/sync checks it.
# The schema version matches the sync-rules package inside powersync-service:1.26.1.
# Columns are listed explicitly so a new server-side column never syncs by accident.
config:
  edition: 3

streams:
  # The global config row, for every User: a returning device learns it is too old while downloading (ADR-0009).
  app_config:
    auto_subscribe: true
    query: SELECT app_config.id, app_config.min_contract_version FROM app_config

  # Every household the User belongs to, with its Memberships, Wallets, Categories, Contacts, Loans, Entries and Items.
  households:
    auto_subscribe: true
    queries:
      - SELECT households.id, households.name, households.personal_user_id, households.base_currency, households.timezone, households.created_at
        FROM households
        WHERE households.id IN (SELECT memberships.household_id FROM memberships WHERE memberships.user_id = auth.user_id())
      - SELECT memberships.id, memberships.household_id, memberships.user_id, memberships.role, memberships.created_at
        FROM memberships
        WHERE memberships.household_id IN (SELECT memberships.household_id FROM memberships WHERE memberships.user_id = auth.user_id())
      - SELECT wallets.id, wallets.household_id, wallets.name, wallets.type, wallets.currency, wallets.archived_at, wallets.created_at
        FROM wallets
        WHERE wallets.household_id IN (SELECT memberships.household_id FROM memberships WHERE memberships.user_id = auth.user_id())
      - SELECT categories.id, categories.household_id, categories.kind, categories.parent_id, categories.name, categories.icon, categories.color, categories.archived_at, categories.created_at
        FROM categories
        WHERE categories.household_id IN (SELECT memberships.household_id FROM memberships WHERE memberships.user_id = auth.user_id())
      - SELECT contacts.id, contacts.household_id, contacts.name, contacts.archived_at, contacts.created_at
        FROM contacts
        WHERE contacts.household_id IN (SELECT memberships.household_id FROM memberships WHERE memberships.user_id = auth.user_id())
      - SELECT loans.id, loans.household_id, loans.contact_id, loans.direction, loans.due_on, loans.written_off_at, loans.notes, loans.created_at
        FROM loans
        WHERE loans.household_id IN (SELECT memberships.household_id FROM memberships WHERE memberships.user_id = auth.user_id())
      # amount is numeric in Postgres and arrives as text: parsed into Money, never a float (ADR-0002).
      - SELECT entries.id, entries.household_id, entries.wallet_id, entries.to_wallet_id, entries.loan_id, entries.kind, entries.amount, entries.to_amount, entries.occurred_on, entries.occurred_time, entries.category_id, entries.description, entries.notes, entries.created_by, entries.created_at
        FROM entries
        WHERE entries.household_id IN (SELECT memberships.household_id FROM memberships WHERE memberships.user_id = auth.user_id())

      - SELECT entry_items.id, entry_items.household_id, entry_items.entry_id, entry_items.position, entry_items.description, entry_items.amount, entry_items.quantity, entry_items.category_id, entry_items.rest, entry_items.created_at
        FROM entry_items
        WHERE entry_items.household_id IN (SELECT memberships.household_id FROM memberships WHERE memberships.user_id = auth.user_id())

  # The User's own profile and the profiles of everyone they share a household with.
  profiles:
    auto_subscribe: true
    queries:
      - SELECT profiles.id, profiles.display_name, profiles.created_at
        FROM profiles
        WHERE profiles.id IN (SELECT memberships.user_id FROM memberships WHERE memberships.household_id IN (SELECT memberships.household_id FROM memberships WHERE memberships.user_id = auth.user_id()))
