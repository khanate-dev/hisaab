# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@0.42.0/schema/sync_rules.json
# Sync Streams. Must stay a subset of what RLS allows (ADR-0007); tests/sync checks it.
# The schema version matches the sync-rules package inside powersync-service:1.26.1.
# Columns are listed explicitly so a new server-side column never syncs by accident.
config:
  edition: 3

streams:
  # The global config row, for every User: a returning device learns it is too old while downloading (ADR-0009).
  app_config:
    auto_subscribe: true
    query: SELECT app_config.id, app_config.min_contract_version FROM app_config

  # Every household the User belongs to, and every Membership in those households.
  households:
    auto_subscribe: true
    queries:
      - SELECT households.id, households.name, households.personal_user_id, households.created_at
        FROM households
        WHERE households.id IN (SELECT household_id FROM memberships WHERE user_id = auth.user_id())
      - SELECT memberships.id, memberships.household_id, memberships.user_id, memberships.role, memberships.created_at
        FROM memberships
        WHERE memberships.household_id IN (SELECT household_id FROM memberships WHERE user_id = auth.user_id())
