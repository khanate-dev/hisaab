# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@0.42.0/schema/sync_rules.json
# Sync Streams. Must stay a subset of what RLS allows (ADR-0007); tests/sync checks it.
# The schema version matches the sync-rules package inside powersync-service:1.26.1.
# Columns are listed explicitly so a new server-side column never syncs by accident.
config:
  edition: 3

streams:
  # The global config row, for every User: a returning device learns it is too old while downloading (ADR-0009).
  app_config:
    auto_subscribe: true
    query: SELECT app_config.id, app_config.min_contract_version FROM app_config

  # Every household the User belongs to, with its Memberships, Wallets, Categories, Contacts, Former members, Loans, Entries, Items, Budgets, Budget overrides, Recurring rules, Occurrences and Attachments.
  households:
    auto_subscribe: true
    queries:
      - SELECT households.id, households.name, households.personal_user_id, households.base_currency, households.timezone, households.budget_month_start_day, households.created_by, households.created_at, households.restored_at
        FROM households
        WHERE households.id IN (SELECT memberships.household_id FROM memberships WHERE memberships.user_id = auth.user_id())
      - SELECT memberships.id, memberships.household_id, memberships.user_id, memberships.role, memberships.default_wallet_id, memberships.created_at
        FROM memberships
        WHERE memberships.household_id IN (SELECT memberships.household_id FROM memberships WHERE memberships.user_id = auth.user_id())
      - SELECT wallets.id, wallets.household_id, wallets.name, wallets.type, wallets.currency, wallets.archived_at, wallets.created_at
        FROM wallets
        WHERE wallets.household_id IN (SELECT memberships.household_id FROM memberships WHERE memberships.user_id = auth.user_id())
      - SELECT categories.id, categories.household_id, categories.kind, categories.parent_id, categories.name, categories.icon, categories.color, categories.archived_at, categories.created_at
        FROM categories
        WHERE categories.household_id IN (SELECT memberships.household_id FROM memberships WHERE memberships.user_id = auth.user_id())
      - SELECT contacts.id, contacts.household_id, contacts.name, contacts.archived_at, contacts.created_at
        FROM contacts
        WHERE contacts.household_id IN (SELECT memberships.household_id FROM memberships WHERE memberships.user_id = auth.user_id())
      # Who stands in for a deleted User in each household ("Former member 1"), for naming what they made.
      - SELECT former_members.id, former_members.household_id, former_members.number, former_members.created_at
        FROM former_members
        WHERE former_members.household_id IN (SELECT memberships.household_id FROM memberships WHERE memberships.user_id = auth.user_id())
      - SELECT loans.id, loans.household_id, loans.contact_id, loans.direction, loans.due_on, loans.written_off_at, loans.notes, loans.created_at
        FROM loans
        WHERE loans.household_id IN (SELECT memberships.household_id FROM memberships WHERE memberships.user_id = auth.user_id())
      # amount is numeric in Postgres and arrives as text: parsed into Money, never a float (ADR-0002).
      - SELECT entries.id, entries.household_id, entries.wallet_id, entries.to_wallet_id, entries.loan_id, entries.link_id, entries.kind, entries.amount, entries.to_amount, entries.occurred_on, entries.occurred_time, entries.category_id, entries.description, entries.notes, entries.created_by, entries.created_at
        FROM entries
        WHERE entries.household_id IN (SELECT memberships.household_id FROM memberships WHERE memberships.user_id = auth.user_id())

      - SELECT entry_items.id, entry_items.household_id, entry_items.entry_id, entry_items.position, entry_items.description, entry_items.amount, entry_items.quantity, entry_items.category_id, entry_items.rest, entry_items.created_at
        FROM entry_items
        WHERE entry_items.household_id IN (SELECT memberships.household_id FROM memberships WHERE memberships.user_id = auth.user_id())

      - SELECT budgets.id, budgets.household_id, budgets.category_id, budgets.valid_from, budgets.amount, budgets.created_at
        FROM budgets
        WHERE budgets.household_id IN (SELECT memberships.household_id FROM memberships WHERE memberships.user_id = auth.user_id())
      - SELECT budget_overrides.id, budget_overrides.household_id, budget_overrides.category_id, budget_overrides.month, budget_overrides.amount, budget_overrides.created_at
        FROM budget_overrides
        WHERE budget_overrides.household_id IN (SELECT memberships.household_id FROM memberships WHERE memberships.user_id = auth.user_id())
      - SELECT recurring_rules.id, recurring_rules.household_id, recurring_rules.mode, recurring_rules.kind, recurring_rules.wallet_id, recurring_rules.category_id, recurring_rules.amount, recurring_rules.description, recurring_rules.frequency, recurring_rules.interval, recurring_rules.day_of_month, recurring_rules.starts_on, recurring_rules.ends_on, recurring_rules.created_by, recurring_rules.created_at
        FROM recurring_rules
        WHERE recurring_rules.household_id IN (SELECT memberships.household_id FROM memberships WHERE memberships.user_id = auth.user_id())
      - SELECT occurrences.id, occurrences.household_id, occurrences.rule_id, occurrences.due_on, occurrences.state, occurrences.snoozed_until, occurrences.entry_id, occurrences.created_at
        FROM occurrences
        WHERE occurrences.household_id IN (SELECT memberships.household_id FROM memberships WHERE memberships.user_id = auth.user_id())
      # The thumbnail syncs with the row; the file itself downloads from Storage when it's opened.
      - SELECT attachments.id, attachments.household_id, attachments.entry_id, attachments.media_type, attachments.size_bytes, attachments.file_name, attachments.thumbnail, attachments.purged_at, attachments.created_by, attachments.created_at
        FROM attachments
        WHERE attachments.household_id IN (SELECT memberships.household_id FROM memberships WHERE memberships.user_id = auth.user_id())

  # A household's Invites, to its Admins only: an Invite's token is the link itself.
  invites:
    auto_subscribe: true
    query: SELECT invites.id, invites.household_id, invites.token, invites.role, invites.email, invites.expires_at, invites.revoked_at, invites.accepted_by, invites.accepted_at, invites.created_by, invites.created_at FROM invites WHERE invites.household_id IN (SELECT memberships.household_id FROM memberships WHERE memberships.user_id = auth.user_id() AND memberships.role = 'admin')

  # A household's CSV import mappings, to its Admins only: importing is an Admin's data tool.
  import_mappings:
    auto_subscribe: true
    query: SELECT import_mappings.id, import_mappings.household_id, import_mappings.wallet_id, import_mappings.mapping, import_mappings.created_at FROM import_mappings WHERE import_mappings.household_id IN (SELECT memberships.household_id FROM memberships WHERE memberships.user_id = auth.user_id() AND memberships.role = 'admin')

  # The User's own Notification inbox, and their own notification preferences in households they belong to.
  notifications:
    auto_subscribe: true
    queries:
      - SELECT notifications.id, notifications.household_id, notifications.user_id, notifications.trigger, notifications.subject_user_id, notifications.payload, notifications.created_at, notifications.read_at
        FROM notifications
        WHERE notifications.user_id = auth.user_id()
      - SELECT notification_preferences.id, notification_preferences.household_id, notification_preferences.user_id, notification_preferences.trigger, notification_preferences.enabled, notification_preferences.email_enabled, notification_preferences.created_at
        FROM notification_preferences
        WHERE notification_preferences.user_id = auth.user_id() AND notification_preferences.household_id IN (SELECT memberships.household_id FROM memberships WHERE memberships.user_id = auth.user_id())

  # The User's own Saved filters, in households they belong to; private, so nobody else's.
  saved_filters:
    auto_subscribe: true
    query: SELECT saved_filters.id, saved_filters.household_id, saved_filters.user_id, saved_filters.name, saved_filters.criteria, saved_filters.created_at FROM saved_filters WHERE saved_filters.user_id = auth.user_id() AND saved_filters.household_id IN (SELECT memberships.household_id FROM memberships WHERE memberships.user_id = auth.user_id())

  # The User's own profile and the profiles of everyone they share a household with.
  profiles:
    auto_subscribe: true
    queries:
      - SELECT profiles.id, profiles.display_name, profiles.created_at
        FROM profiles
        WHERE profiles.id IN (SELECT memberships.user_id FROM memberships WHERE memberships.household_id IN (SELECT memberships.household_id FROM memberships WHERE memberships.user_id = auth.user_id()))
