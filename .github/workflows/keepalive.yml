name: keepalive

# Free tiers stop idle projects: Supabase pauses after 7 days without activity; PowerSync Cloud deprovisions after
# 7 days with no deploys or client connections (ADR-0011). So this does what a device does, as a keep-alive User
# with nothing but its own empty Personal household: signs in, reads through the Data API, and opens a sync stream.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  keepalive:
    # PROD_ENABLED (a repo variable) is set once the prod setup in docs/infra.md is done.
    if: vars.PROD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: prod
    steps:
      - name: Sign in, read, sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          KEEPALIVE_EMAIL: ${{ secrets.KEEPALIVE_EMAIL }}
          KEEPALIVE_PASSWORD: ${{ secrets.KEEPALIVE_PASSWORD }}
          POWERSYNC_URL: ${{ secrets.POWERSYNC_URL }}
        run: |
          token=$(jq -n --arg email "$KEEPALIVE_EMAIL" --arg password "$KEEPALIVE_PASSWORD" '{$email, $password}' \
            | curl --fail --silent --show-error --retry 3 -X POST \
                "$SUPABASE_URL/auth/v1/token?grant_type=password" \
                -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" -d @- \
            | jq -r .access_token)
          echo "::add-mask::$token"
          curl --fail --silent --show-error --retry 3 \
            "$SUPABASE_URL/rest/v1/households?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Authorization: Bearer $token" > /dev/null
          # The stream never ends by itself; the timeout ends it, and the status says whether it was accepted.
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 10 \
            -X POST "$POWERSYNC_URL/sync/stream" \
            -H "Authorization: Token $token" -H "Content-Type: application/json" \
            -d '{"raw_data":true}' || true)
          echo "sync/stream answered $status"
          test "$status" = 200
