# The ADR-0010 gate set. Runs with no secrets: the repo is public and forks open PRs (ADR-0011).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, format, spellcheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: pnpm check

  backend:
    name: Migrations, pgTAP, sync harness, Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # A fresh runner has an empty database, so this applies every migration from zero.
      - name: Start the local stack
        run: pnpm stack:up
      - name: pgTAP
        run: pnpm test:db
      - name: Sync harness
        run: pnpm test:sync
      - name: Edge Functions smoke run
        run: pnpm test:functions
      - name: PowerSync logs
        if: failure()
        run: docker compose -f powersync/compose.yaml logs powersync
