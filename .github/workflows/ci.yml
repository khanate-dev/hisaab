# The ADR-0010 gate set. Runs with no secrets: the repo is public and forks open PRs (ADR-0011).
name: ci

on:
  pull_request:
    # Labelling or unlabelling re-runs the contract check.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every main commit keeps its run, since deploy waits on it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, lint, format, spellcheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm check
      # Every string goes through Lingui (ADR-0008); the committed catalogs must match the source.
      - name: Message catalogs are up to date
        run: |
          pnpm --filter @hisaab/app i18n:extract
          pnpm --filter @hisaab/app i18n:compile
          test -z "$(git status --porcelain -- apps/app/src/locales)" || { git status --porcelain -- apps/app/src/locales; exit 1; }

  # ADR-0009/0011: a new migration that's a contract change (Squawk's destructive rules, a DROP, SET NOT NULL, a retype,
  # a min_contract_version raise) needs the `contract` label; a merged migration is never edited. Squawk's other advice
  # shows as warnings on the PR.
  contract:
    name: Contract changes are labelled
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check the new migrations
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: node tooling/migrations/contract-check.ts check "$BASE"

  backend:
    name: Migrations, pgTAP, sync harness, Edge Functions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.7
      - name: Type-check Edge Functions
        run: pnpm check:functions
      # A fresh runner has an empty database, so this applies every migration from zero.
      - name: Start the local stack
        run: pnpm stack:up
      - name: pgTAP
        run: pnpm test:db
      - name: Sync harness
        run: pnpm test:sync
      - name: Edge Functions smoke run
        run: pnpm test:functions
      - name: Stack logs
        if: failure()
        run: |
          for container in $(docker ps --all --filter name=hisaab --format '{{.Names}}'); do
            echo "::group::$container"
            docker logs --tail 200 "$container" 2>&1
            echo "::endgroup::"
          done
