# Prod deploy (ADR-0011): after `ci` passes on a main commit, in the ADR-0009 expand order. Each job needs the one
# before it, so a failure stops everything after it: snapshot, then the database, then Sync Streams, then web.
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-prod
  # A deploy never stops halfway; the next one waits for it.
  cancel-in-progress: false

env:
  # The commit ci passed on, not whatever main is by now.
  SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  snapshot:
    name: pg_dump snapshot to R2
    # PROD_ENABLED (a repo variable) is set once the prod setup in docs/infra.md is done; until then nothing runs.
    if: >-
      vars.PROD_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Roles, schema and data, so a restore is never more than one merge behind. The bucket's lifecycle rule
      # deletes them after 30 days (docs/infra.md).
      - name: Dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          out="$RUNNER_TEMP/snapshot"
          mkdir -p "$out"
          pnpm exec supabase db dump --db-url "$SUPABASE_DB_URL" --role-only -f "$out/roles.sql"
          pnpm exec supabase db dump --db-url "$SUPABASE_DB_URL" -f "$out/schema.sql"
          pnpm exec supabase db dump --db-url "$SUPABASE_DB_URL" --data-only --use-copy -f "$out/data.sql"
          gzip "$out"/*.sql
      - name: Upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 rejects the checksums newer AWS CLIs add by default.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws s3 cp --recursive --endpoint-url "$R2_ENDPOINT" \
            "$RUNNER_TEMP/snapshot" "s3://$R2_BUCKET/deploys/$(date -u +%Y-%m-%dT%H%M%SZ)-$SHA/"

  database:
    name: Migrations, config, secrets, Edge Functions
    needs: snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The prod overrides (supabase/remotes/prod.toml) apply only under the literal ref. The config loader also wants
      # signing_keys.json, which is local-only and never pushed, so an empty one stands in.
      - name: Prod config
        run: |
          printf '\n' >> supabase/config.toml
          envsubst '$SUPABASE_PROJECT_REF' < supabase/remotes/prod.toml >> supabase/config.toml
          echo '[]' > supabase/signing_keys.json
      - run: pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - run: pnpm exec supabase db push --yes
      - name: Config push
        env:
          RESEND_SMTP_PASSWORD: ${{ secrets.RESEND_SMTP_PASSWORD }}
        run: pnpm exec supabase config push --yes
      # GitHub stays the source of Edge Function secrets; Supabase injects its own URL and keys.
      - name: Edge Function secrets
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          file="$RUNNER_TEMP/functions.env"
          printf 'VAPID_PUBLIC_KEY=%s\nVAPID_PRIVATE_KEY=%s\nVAPID_SUBJECT=%s\n' \
            "$VAPID_PUBLIC_KEY" "$VAPID_PRIVATE_KEY" "$VAPID_SUBJECT" > "$file"
          pnpm exec supabase secrets set --env-file "$file"
          rm "$file"
      - run: pnpm exec supabase functions deploy --use-api
      # pg_cron calls the notification functions with what Vault holds (#60, #62): the project's URL and a secret key,
      # read from Supabase on each deploy so a rotated key follows on its own.
      - name: Vault secrets for pg_cron
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          key=$(pnpm exec supabase projects api-keys --project-ref "$SUPABASE_PROJECT_REF" --reveal -o json \
            | jq -r '[.. | strings | select(startswith("sb_secret_"))][0] // empty')
          if [[ -z $key ]]; then
            echo "::error::No sb_secret_ key on the project; create one under Settings → API Keys."
            exit 1
          fi
          echo "::add-mask::$key"
          export PROJECT_URL="https://$SUPABASE_PROJECT_REF.supabase.co" SERVICE_KEY="$key"
          psql "$SUPABASE_DB_URL" --quiet --no-psqlrc -v ON_ERROR_STOP=1 > /dev/null <<'SQL'
          \getenv project_url PROJECT_URL
          \getenv service_key SERVICE_KEY
          select vault.update_secret(id, :'project_url') from vault.secrets where name = 'project_url';
          select vault.create_secret(:'project_url', 'project_url')
            where not exists (select from vault.secrets where name = 'project_url');
          select vault.update_secret(id, :'service_key') from vault.secrets where name = 'service_role_key';
          select vault.create_secret(:'service_key', 'service_role_key')
            where not exists (select from vault.secrets where name = 'service_role_key');
          SQL

  sync:
    name: Sync Streams to PowerSync Cloud
    needs: database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Only the Sync Streams: the instance's own config (connection, client auth) is set once in the dashboard
      # (docs/infra.md). An empty directory keeps the CLI off powersync/service.yaml, which is the local stack's.
      - name: Deploy sync config
        env:
          PS_ADMIN_TOKEN: ${{ secrets.POWERSYNC_ADMIN_TOKEN }}
          INSTANCE_ID: ${{ secrets.POWERSYNC_INSTANCE_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/powersync"
          npx --yes powersync@0.10.2 deploy sync-config \
            --directory "$RUNNER_TEMP/powersync" \
            --sync-config-file-path "$GITHUB_WORKSPACE/powersync/sync-config.yaml" \
            --instance-id "$INSTANCE_ID"

  web:
    name: Web export to Workers
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The public client config lives in EAS under `production`, shared with the native builds.
      - name: Client config from EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          jq -e '.expo.extra.eas.projectId' app.json > /dev/null \
            || { echo "::error::No EAS project id in app.json; run \`eas init\` and commit it."; exit 1; }
          npx --yes eas-cli@24.13.0 env:pull --environment production --non-interactive
      - run: pnpm prepare:web
      - run: pnpm exec expo export --platform web
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.150.0 deploy
