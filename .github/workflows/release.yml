# Native release (ADR-0011; #66): run by hand from main. It never gets ahead of the backend: `deploy` must have
# succeeded for this commit or a later one. The fingerprint (the runtime) decides the path:
# - nothing native changed since the newest store builds → an OTA update to `preview`, which the internal builds
#   (Android APK, TestFlight) listen on; once it passes the smoke checklist (docs/release-smoke.md) the `prod-release`
#   reviewer approves, and that same update is republished to `production`;
# - anything native changed → new internal builds on `preview` first (APK, TestFlight); once they pass the checklist
#   and `prod-release` approves, store builds at the new version, submitted (Play staged, iOS phased), and a stamped
#   update on `production` for their runtime.
# Either way the version is tagged. Every update's message starts with its contract stamp, `[contract N]`, which the
# deploy gate's raise check reads (tooling/release/contract-ready.ts), so every live runtime carries one.
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version goes up
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Check and pick the path
    if: github.ref == 'refs/heads/main' && vars.PROD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    outputs:
      path: ${{ steps.path.outputs.path }}
      version: ${{ steps.version.outputs.version }}
      stamp: ${{ steps.version.outputs.stamp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Native never runs ahead of the backend: some successful deploy must contain this commit.
      - name: Deployed already
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for sha in $(gh run list --repo "$REPO" --workflow deploy.yml --status success --limit 30 --json headSha --jq '.[].headSha'); do
            if git merge-base --is-ancestor "$GITHUB_SHA" "$sha" 2>/dev/null; then
              echo "Deployed in $sha."
              exit 0
            fi
          done
          echo "::error::deploy hasn't succeeded for $GITHUB_SHA or a later commit yet; release after it does."
          exit 1
      - name: App Store Connect app id
        env:
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
        run: |
          [[ $ASC_APP_ID =~ ^[0-9]+$ ]] || { echo "::error::Set the repo variable ASC_APP_ID (docs/infra.md §6)."; exit 1; }
      - id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          echo "version=$(node tooling/release/release.ts next "$BUMP" $(git tag --list 'v*'))" >> "$GITHUB_OUTPUT"
          echo "stamp=$(node tooling/release/release.ts stamp)" >> "$GITHUB_OUTPUT"
      # With `runtimeVersion: { policy: "fingerprint" }` the runtime is the fingerprint (the version left out, in
      # fingerprint.config.js): an update reaches only builds on the same one.
      - id: path
        working-directory: apps/app
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          pnpm exec expo-updates runtimeversion:resolve --platform android > "$RUNNER_TEMP/android.json"
          pnpm exec expo-updates runtimeversion:resolve --platform ios > "$RUNNER_TEMP/ios.json"
          pnpm exec eas build:list --channel production --distribution store --status finished --platform all \
            --limit 20 --json --non-interactive > "$RUNNER_TEMP/builds.json"
          path=$(node ../../tooling/release/release.ts path "$RUNNER_TEMP/android.json" "$RUNNER_TEMP/ios.json" "$RUNNER_TEMP/builds.json")
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "Release path: $path"

  # Fingerprint matches: an update to `preview`, one group per platform (their runtimes differ).
  preview-update:
    name: OTA to preview
    needs: plan
    if: needs.plan.outputs.path == 'ota'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: prod
    outputs:
      groups: ${{ steps.publish.outputs.groups }}
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - id: publish
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MESSAGE: ${{ needs.plan.outputs.stamp }} v${{ needs.plan.outputs.version }}
        run: |
          pnpm exec eas update --channel preview --environment production --message "$MESSAGE" \
            --non-interactive --json > "$RUNNER_TEMP/update.json"
          echo "groups=$(jq -r '[.[].group] | unique | join(" ")' "$RUNNER_TEMP/update.json")" >> "$GITHUB_OUTPUT"

  # The smoke checklist is ticked against that exact update before the `prod-release` reviewer approves; the tested
  # update is the one that ships, its stamp passed on.
  production-update:
    name: Republish to production
    needs: [plan, preview-update]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod-release
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GROUPS: ${{ needs.preview-update.outputs.groups }}
          MESSAGE: ${{ needs.plan.outputs.stamp }} v${{ needs.plan.outputs.version }}
        run: |
          for group in $GROUPS; do
            pnpm exec eas update:republish --group "$group" --destination-channel production --message "$MESSAGE" \
              --non-interactive
          done

  # Fingerprint differs: internal builds on `preview` at the new runtime first (an APK, and TestFlight), to smoke-test.
  preview-builds:
    name: Internal builds
    needs: plan
    if: needs.plan.outputs.path == 'store'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: prod
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Version and App Store Connect app
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
        run: |
          jq --arg v "$VERSION" '.expo.version = $v' app.json > app.json.next && mv app.json.next app.json
          jq --arg id "$ASC_APP_ID" '.submit.preview.ios.ascAppId = $id | .submit.production.ios.ascAppId = $id' eas.json \
            > eas.json.next && mv eas.json.next eas.json
      - env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          pnpm exec eas build --profile preview --platform android --non-interactive --wait
          pnpm exec eas build --profile preview --platform ios --auto-submit --non-interactive --wait

  # Once the internal builds pass the checklist: store builds at the new version (build numbers are EAS's), submitted to
  # both stores, then a stamped update on `production` for their runtime, so a contract raise finds it covered.
  store:
    name: Store builds and submit
    needs: [plan, preview-builds]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment: prod-release
    defaults:
      run:
        working-directory: apps/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Version and App Store Connect app
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          ASC_APP_ID: ${{ vars.ASC_APP_ID }}
        run: |
          jq --arg v "$VERSION" '.expo.version = $v' app.json > app.json.next && mv app.json.next app.json
          jq --arg id "$ASC_APP_ID" '.submit.preview.ios.ascAppId = $id | .submit.production.ios.ascAppId = $id' eas.json \
            > eas.json.next && mv eas.json.next eas.json
      - env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MESSAGE: ${{ needs.plan.outputs.stamp }} v${{ needs.plan.outputs.version }}
        run: |
          pnpm exec eas build --profile production --platform all --auto-submit --non-interactive --wait
          pnpm exec eas update --channel production --environment production --message "$MESSAGE" --non-interactive

  tag:
    name: Tag the version
    needs: [plan, production-update, store]
    if: >-
      always() && needs.plan.result == 'success' &&
      (needs.production-update.result == 'success' || needs.store.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          VERSION: v${{ needs.plan.outputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"
