packages:
  - apps/*
  - packages/*
  - tests/*

# Packages whose install scripts must run: the Supabase CLI downloads its binary;
# better-sqlite3 (the @powersync/node driver in tests/sync) fetches or compiles its native addon.
onlyBuiltDependencies:
  - better-sqlite3
  - supabase

# `pnpm add` must go through the catalog.
catalogMode: strict

# Every dependency version lives here, exact. package.json files reference `catalog:` only.
catalog:
  # Expo SDK 57 set (seeded from the Spike, #14; matches expo@57.0.31's bundledNativeModules.json)
  expo: 57.0.31
  "@expo/metro-runtime": 57.0.17
  "@react-native-async-storage/async-storage": 2.2.0
  expo-constants: 57.0.22
  expo-crypto: 57.0.4
  expo-dev-client: 57.0.20
  expo-linking: 57.0.13
  expo-localization: 57.0.2
  expo-router: 57.0.29
  expo-status-bar: 57.0.1
  # Attachments (#55): picking, shrinking and keeping files on the device; SDK 57's bundled versions
  expo-document-picker: 57.0.3
  expo-file-system: 57.0.7
  expo-image-manipulator: 57.0.21
  expo-image-picker: 57.0.20
  react: 19.2.3
  react-dom: 19.2.3
  react-native: 0.86.3
  react-native-reanimated: 4.5.1
  react-native-worklets: 0.10.1
  react-native-safe-area-context: 5.7.0
  react-native-screens: 4.26.2
  react-native-web: 0.21.4
  "@react-native/metro-config": 0.86.3
  "@types/react": 19.2.18

  # UI (ADR-0008): NativeWind 4 runs on Tailwind 3; react-native-svg and expo-font match SDK 57
  "@expo-google-fonts/archivo-black": 0.4.1
  "@expo-google-fonts/space-grotesk": 0.4.1
  "@rn-primitives/dialog": 1.5.2
  "@rn-primitives/portal": 1.5.3
  "@rn-primitives/radio-group": 1.5.2
  expo-font: 57.0.4
  lucide-react-native: 1.54.0
  nativewind: 4.2.7
  # nativewind 4.2.7 pins it; its JSX runtime resolves from the app, so the app depends on it directly
  react-native-css-interop: 0.2.7
  react-native-svg: 15.15.4
  tailwindcss: 3.4.19

  # i18n (ADR-0008): every string goes through Lingui
  "@lingui/babel-plugin-lingui-macro": 6.9.1
  "@lingui/cli": 6.9.1
  "@lingui/core": 6.9.1
  "@lingui/format-po": 6.9.1
  "@lingui/react": 6.9.1
  eslint-plugin-lingui: 0.16.0
  babel-preset-expo: 57.0.16

  # Sync and local data. drizzle-orm stays below 1.0: @powersync/drizzle-driver's peer range is <1.0.0.
  "@powersync/common": 2.3.1
  "@powersync/drizzle-driver": 0.8.0
  "@powersync/node": 1.1.1
  "@powersync/react": 2.0.2
  "@powersync/react-native": 2.3.1
  # Same version as inside journeyapps/powersync-service:1.26.1; tests/sync validates Sync Streams with it
  "@powersync/service-sync-rules": 0.42.0
  "@powersync/web": 2.4.2
  "@azure/core-asynciterator-polyfill": 1.0.2
  "@op-engineering/op-sqlite": 17.2.0
  "@supabase/supabase-js": 2.117.2
  "@tanstack/react-query": 5.104.2
  # tests/sync mints client-side UUIDv7 ids for its seed
  uuid: 14.0.2
  react-native-url-polyfill: 4.0.0
  better-sqlite3: 12.11.1
  drizzle-orm: 0.45.3

  # Domain
  decimal.js: 10.6.0
  fast-check: 4.10.2

  # Component tests (jest-expo 57 runs on Jest 29)
  "@testing-library/react-native": 14.1.0
  "@jest/globals": 29.7.0
  jest: 29.7.0
  jest-expo: 57.0.6
  test-renderer: 1.3.0

  # Tooling
  "@eslint/js": 10.0.1
  "@types/estree": 1.0.9
  "@types/node": 24.19.2
  cspell: 9.8.0
  eslint: 10.12.0
  eslint-plugin-react-hooks: 7.1.1
  globals: 17.13.0
  prettier: 3.9.10
  supabase: 2.120.0
  typescript: 6.0.3
  typescript-eslint: 8.72.0
  vitest: 4.1.12
